<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイムカード | やまのアプリ</title>
  <meta name="description" content="出勤・退勤をワンタップで記録。勤務時間の集計もおまかせ。">
  <meta property="og:title" content="タイムカード">
  <meta property="og:description" content="出勤・退勤をワンタップで記録。勤務時間の集計もおまかせ。">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/images/timecard.png">
  <link rel="icon" href="/images/timecard.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="theme-timecard">
  <header class="site-header">
    <div class="container">
      <a class="logo" href="/">やまのアプリ</a>
      <nav><a href="/">← アプリ一覧</a></nav>
    </div>
  </header>

  <section class="app-hero">
    <div class="container">
      <img src="/images/timecard.png" alt="タイムカード アイコン">
      <div>
        <h1>タイムカード</h1>
        <p class="catch">出勤・退勤をワンタップで記録。勤務時間の集計もおまかせ。</p>
        <div class="store-buttons">
          <!-- ストアのURLに差し替えてください。iOS版がなければ App Store のボタンは削除 -->
          <a class="btn" href="#">Google Play で入手</a>
          <a class="btn outline" href="#">App Store で入手</a>
        </div>
      </div>
    </div>
  </section>

  <main>
    <section class="section container">
      <h2>主な機能</h2>
      <div class="features">
        <div class="feature">
          <h3>ワンタップ打刻</h3>
          <p>ボタンを押すだけで出勤・退勤の時刻を記録できます。</p>
        </div>
        <div class="feature">
          <h3>勤務時間の自動集計</h3>
          <p>日・月ごとの勤務時間を自動で計算します。</p>
        </div>
        <div class="feature">
          <h3>一覧で確認</h3>
          <p>過去の打刻履歴をカレンダー形式で振り返れます。</p>
        </div>
      </div>
    </section>

    <section class="section container">
      <h2>スクリーンショット</h2>
      <!-- 画像を /images/timecard-1.png などで置き、placeholder を
           <img src="/images/timecard-1.png" alt="画面1"> に置き換えてください -->
      <div class="screenshots">
        <div class="placeholder">スクリーンショット1</div>
        <div class="placeholder">スクリーンショット2</div>
        <div class="placeholder">スクリーンショット3</div>
        <div class="placeholder">スクリーンショット4</div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p><a href="/">アプリ一覧</a><a href="/timecard/privacy.html">プライバシーポリシー</a></p>
    <p>&copy; 2026 やまのアプリ</p>
  </footer>
</body>
</html>
