<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カレンダー | やまのアプリ</title>
  <meta name="description" content="見やすく、書きこみやすい。毎日の予定をシンプルに管理。">
  <meta property="og:title" content="カレンダー">
  <meta property="og:description" content="見やすく、書きこみやすい。毎日の予定をシンプルに管理。">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/images/calendar.png">
  <link rel="icon" href="/images/calendar.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="theme-calendar">
  <header class="site-header">
    <div class="container">
      <a class="logo" href="/">やまのアプリ</a>
      <nav><a href="/">← アプリ一覧</a></nav>
    </div>
  </header>

  <section class="app-hero">
    <div class="container">
      <img src="/images/calendar.png" alt="カレンダー アイコン">
      <div>
        <h1>カレンダー</h1>
        <p class="catch">見やすく、書きこみやすい。毎日の予定をシンプルに管理。</p>
        <div class="store-buttons">
          <!-- ストアのURLに差し替えてください。iOS版がなければ App Store のボタンは削除 -->
          <a class="btn" href="#">Google Play で入手</a>
          <a class="btn outline" href="#">App Store で入手</a>
        </div>
      </div>
    </div>
  </section>

  <main>
    <section class="section container">
      <h2>主な機能</h2>
      <div class="features">
        <div class="feature">
          <h3>見やすい月表示</h3>
          <p>土日・祝日が色分けされ、ひと目で予定がわかります。</p>
        </div>
        <div class="feature">
          <h3>手軽に書きこみ</h3>
          <p>日付をタップするだけで予定を追加できます。</p>
        </div>
        <div class="feature">
          <h3>通知でお知らせ</h3>
          <p>大事な予定を忘れないようにリマインドします。</p>
        </div>
      </div>
    </section>

    <section class="section container">
      <h2>スクリーンショット</h2>
      <!-- 画像を /images/calendar-1.png などで置き、placeholder を
           <img src="/images/calendar-1.png" alt="画面1"> に置き換えてください -->
      <div class="screenshots">
        <div class="placeholder">スクリーンショット1</div>
        <div class="placeholder">スクリーンショット2</div>
        <div class="placeholder">スクリーンショット3</div>
        <div class="placeholder">スクリーンショット4</div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p><a href="/">アプリ一覧</a><a href="/calendar/privacy.html">プライバシーポリシー</a></p>
    <p>&copy; 2026 やまのアプリ</p>
  </footer>
</body>
</html>
