<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KantanSimpleApp</title>
  <meta name="description" content="個人開発アプリの紹介サイトです。タイムカード・カレンダー・脳トレアプリを公開しています。">

  <!-- SNSでシェアされたときの表示（OGP） -->
  <meta property="og:title" content="やまのアプリ">
  <meta property="og:description" content="個人開発アプリの紹介サイト">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/images/timecard.png">
  <!-- 独自ドメインが決まったら og:url も追加：<meta property="og:url" content="https://example.com/"> -->

  <link rel="icon" href="/images/timecard.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="/">KantanSimpleApp</a>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>毎日をちょっと便利にするアプリ</h1>
      <p>個人で開発しているアプリを紹介しています。</p>
    </section>

    <section class="app-grid">
      <a class="app-card" href="/timecard/">
        <img src="/images/timecard.png" alt="タイムカード アイコン">
        <h2>タイムカード</h2>
        <p>出勤・退勤をワンタップで記録</p>
        <span class="more">詳しく見る →</span>
      </a>

      <a class="app-card" href="/calendar/">
        <img src="/images/calendar.png" alt="カレンダー アイコン">
        <h2>カレンダー</h2>
        <p>予定をシンプルに管理</p>
        <span class="more">詳しく見る →</span>
      </a>

      <a class="app-card" href="/brain/">
        <img src="/images/brain.png" alt="脳トレ アイコン">
        <h2>脳トレ</h2>
        <p>すきま時間で頭の体操</p>
        <span class="more">詳しく見る →</span>
      </a>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 やまのアプリ</p>
  </footer>
</body>
</html>
