<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KantanSimpleApp</title>
  <meta name="description" content="個人開発アプリの紹介サイトです。タイムカード・カレンダー・脳トレアプリを公開しています。">

  <!-- SNSでシェアされたときの表示（OGP） -->
  <meta property="og:title" content="KantanSimpleApp">
  <meta property="og:description" content="個人開発アプリの紹介サイト">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/images/timecard.png">
  <!-- 独自ドメインが決まったら og:url も追加：<meta property="og:url" content="https://example.com/"> -->

  <link rel="icon" href="/images/timecard.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="/">KantanSimpleApp</a>
      <nav>
        <a href="/" aria-current="page">アプリ一覧</a>
        <a href="/timecard/">タイムカード</a>
        <a href="/calendar/">カレンダー</a>
        <a href="/brain/">脳トレ</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>毎日をちょっと便利にするアプリ</h1>
      <p>個人で開発しているアプリを紹介しています。</p>
    </section>

    <section class="app-grid">
      <a class="app-card" href="/timecard/">
        <img src="/images/timecard.png" alt="タイムカード アイコン">
        <h2>かんたんシンプル！タイムカード</h2>
        <p>GPSつきで出勤・退勤をワンタップ記録</p>
        <span class="more">詳しく見る →</span>
      </a>

      <a class="app-card" href="/calendar/">
        <img src="/images/calendar.png" alt="カレンダー アイコン">
        <h2>カレンダータスクリスト&amp;報告書</h2>
        <p>家族やチームと予定を共有</p>
        <span class="more">詳しく見る →</span>
      </a>

      <a class="app-card" href="/brain/">
        <img src="/images/brain.png" alt="脳トレ アイコン">
        <h2>脳トレ ミニゲーム</h2>
        <p>26種類のミニゲームで頭の体操</p>
        <span class="more">詳しく見る →</span>
      </a>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 KantanSimpleApp</p>
  </footer>
</body>
</html>
